  .nav-btn .ico{font-size:19px;filter:drop-shadow(0 3px 7px rgba(0,0,0,.18))}
  .nav-btn.active{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 20%,transparent)}
  .floating-add{left:20px;bottom:96px;background:linear-gradient(145deg,#765de9,#4e46b4);color:#fff;border:1px solid rgba(184,171,255,.45);box-shadow:0 12px 28px rgba(68,57,173,.36);border-radius:16px}

  .event-countdown{background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 15%,var(--panel)),var(--panel2));border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));border-radius:18px}
  .event-days{background:var(--panel3);border-radius:14px}
  .progress-ring .ring-label small{color:var(--muted)}
  .schedule-day-card,.planned-day-group{border-color:var(--line)}
  .schedule-day-head{background:color-mix(in srgb,var(--blue) 10%,var(--panel2));border-radius:12px}

  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  @media(max-width:700px){
    .app-shell{padding-left:12px;padding-right:12px;padding-bottom:120px}
    .hero{margin-left:-12px;margin-right:-12px;height:190px;border-radius:0 0 24px 24px}
    .hero-top{padding:13px 15px}
    .hero-center{inset:54px 12px 10px}
    .tabs{margin-bottom:14px;padding:5px;gap:4px;border-radius:14px}
    .tab{min-width:88px;padding:8px 9px;font-size:11px}
    .panel{padding:14px;border-radius:18px}
    .bottom-nav{left:8px;right:8px;bottom:max(6px,env(safe-area-inset-bottom));border-radius:18px}
    .nav-btn{font-size:8px}
    .floating-add{left:15px;bottom:91px}
  }
  @media(max-width:390px){
    .hero{height:180px}
    .profile-chip-name{max-width:80px}
    .stats-row{gap:7px}
    .stat{padding:10px}
    .nav-btn .ico{font-size:17px}
  }
}

.hero{isolation:isolate}

/* Print report visual language: match the navy / violet / orange study app theme. */
@media print{
  html,body{background:#08112f!important;color:#edf1ff!important;font-family:"Vazirmatn","Noto Sans Arabic",Tahoma,Arial,sans-serif!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}

  #print-report{display:block!important;direction:rtl;color:#edf1ff!important;background:#08112f!important;padding:0!important;margin:0!important;font-family:"Vazirmatn","Noto Sans Arabic",Tahoma,Arial,sans-serif!important;font-size:9px!important;line-height:1.6!important}
  #print-report *{box-sizing:border-box;font-family:"Vazirmatn","Noto Sans Arabic",Tahoma,Arial,sans-serif!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .pr-page{width:100%;position:relative;overflow:hidden;color:#edf1ff!important;background:radial-gradient(ellipse at 88% 2%,rgba(105,88,210,.22),transparent 42%),radial-gradient(ellipse at 8% 98%,rgba(246,119,65,.10),transparent 36%),linear-gradient(150deg,#0b1435 0%,#101b42 56%,#0a1230 100%)!important;border:1px solid rgba(129,126,230,.34);border-radius:4mm;padding:4mm}
  .pr-page:before{content:"";position:absolute;left:-24mm;bottom:18mm;width:58mm;height:58mm;border-radius:50%;background:rgba(109,88,214,.07);filter:blur(1px);pointer-events:none;z-index:0}
  .pr-page:after{content:"";position:absolute;right:-20mm;top:48mm;width:48mm;height:48mm;border-radius:50%;background:rgba(246,119,65,.055);pointer-events:none;z-index:0}
  .pr-page>*{position:relative;z-index:1}
  .pr-page-one{break-after:page;page-break-after:always}
  .pr-brand-strip{height:20mm;margin:-4mm -4mm 0;padding:0 7mm;background:linear-gradient(105deg,#111d49 0%,#172451 56%,#29215f 100%)!important;border-bottom:1px solid rgba(147,133,255,.45);border-radius:0 0 4mm 4mm;display:flex;align-items:center;justify-content:flex-end;position:relative;overflow:hidden;color:#fff!important}
  .pr-print-decor{position:absolute!important;left:0;bottom:0;width:61mm;height:20mm;max-width:46%;object-fit:contain!important;object-position:left bottom!important;opacity:.98;z-index:1;pointer-events:none}
  .pr-brand-logo{position:relative;z-index:2;display:flex;align-items:center;flex-direction:row;gap:2mm;font-size:9px;font-weight:900;line-height:1.2;color:#fff!important}
  .pr-brand-mark{width:9mm;height:9mm;border-radius:3mm;display:grid;place-items:center;background:linear-gradient(145deg,#7562ed,#4d47a5)!important;border:1px solid rgba(203,194,255,.5);color:#fff!important;font-size:18px;line-height:1;box-shadow:0 1mm 3mm rgba(0,0,0,.22)}
  .pr-brand-name{font-size:9px;margin-top:0;letter-spacing:.1px;color:#fff!important}
  .pr-head-main{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px;align-items:center;padding:4mm 2mm 3mm;min-height:27mm}
  .pr-user{display:flex;align-items:center;gap:2mm;justify-content:flex-start;min-width:0;text-align:right}
  .pr-avatar{width:19mm;height:19mm;flex:none;border-radius:4mm;overflow:hidden;background:#202b59!important;border:1px solid #877bfa;display:grid;place-items:center;color:#c7c6ff;font-size:24px;box-shadow:0 1mm 3mm rgba(0,0,0,.24)}
  .pr-avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .pr-user-meta{min-width:0;display:flex;flex-direction:column;gap:2px}
  .pr-user-meta strong{font-size:10px;color:#fff!important;overflow-wrap:anywhere}
  .pr-user-meta small{font-size:7px;color:#b4c0e8!important}
  .pr-title{text-align:center;min-width:0}
  .pr-title h1{font-size:16px;line-height:1.5;margin:0;color:#fff!important;font-weight:900}
  .pr-title p{font-size:8px;color:#b8c3ee!important;margin:2px 0 0}
  .pr-period-side{text-align:left;color:#c0c6e8!important;font-size:8px;line-height:1.8}
  .pr-streak-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:1mm 0 3mm;padding:2.5mm 4mm;border-radius:3mm;background:linear-gradient(100deg,#33265f 0%,#4c2d62 58%,#6b3d4b 100%)!important;border:1px solid rgba(255,171,103,.35);color:#ffe9ca!important;font-size:9px}
  .pr-streak-banner strong{font-size:10px;color:#ffb46f!important}
  .pr-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2.5mm;margin:0 0 3.5mm}
  .pr-stat{min-height:19mm;padding:2.6mm 3mm;border-radius:3mm;background:linear-gradient(145deg,#19264f,#151f44)!important;border:1px solid rgba(126,121,226,.32);text-align:right;display:flex;flex-direction:column;justify-content:center;gap:2px;box-shadow:0 1mm 2.5mm rgba(0,0,0,.12)}
  .pr-stat small{display:block;color:#b6c1e5!important;font-size:8px}
  .pr-stat strong{font-size:14px;color:#ff9c5c!important;font-weight:900;white-space:nowrap;direction:ltr;text-align:right}
  .pr-stat em{font-size:7px;color:#8797c7!important;font-style:normal}
  .pr-section{margin:0 0 3.5mm;padding:3mm;border-radius:3mm;background:linear-gradient(145deg,rgba(25,38,80,.96),rgba(18,29,64,.98))!important;border:1px solid rgba(119,126,216,.28);break-inside:avoid;page-break-inside:avoid;box-shadow:0 1mm 3mm rgba(0,0,0,.10)}
  .pr-section h2{font-size:10px;margin:0 0 2mm;color:#fff!important;font-weight:900}
  .pr-section h2:after{content:"";display:block;width:19mm;height:1.1px;background:linear-gradient(90deg,#ff8a4b,#7d6cf1);margin-top:1mm;border-radius:10px}
  .pr-chart{height:42mm;display:flex;align-items:stretch;justify-content:space-around;border-bottom:1px solid rgba(169,177,235,.24);padding:2mm 2mm 0;gap:2mm}
  .pr-bar-col{height:100%;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:1mm;flex:1}
  .pr-bar-value{font-size:7px;color:#f6b27b!important;white-space:nowrap}
  .pr-bar-track{height:30mm;width:9mm;display:flex;align-items:flex-end;justify-content:center;background:rgba(91,102,164,.12);border-radius:3mm 3mm 1mm 1mm;overflow:hidden}
  .pr-bar{width:100%;background:linear-gradient(180deg,#ff9b59 0%,#9563e6 100%)!important;border-radius:3px 3px 1px 1px;min-height:1px}
  .pr-bar-col small{font-size:7px;color:#b6c1e5!important;white-space:nowrap}
  .pr-subject-breakdown{display:grid;gap:2.1mm;margin-top:1mm}
  .pr-subject-row{display:grid;grid-template-columns:30mm 1fr 22mm;gap:3mm;align-items:center;font-size:8px}
  .pr-subject-name{color:#dce3ff!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pr-subject-track{height:3mm;border-radius:20px;background:#27345f!important;border:1px solid rgba(134,128,226,.18);overflow:hidden}
  .pr-subject-track span{display:block;height:100%;background:linear-gradient(90deg,#7364e9,#ff8e51)!important;border-radius:20px}
  .pr-subject-time{direction:ltr;text-align:left;color:#bac5e9!important;font-size:7px;white-space:nowrap}
  .pr-table-wrap{width:100%;overflow:visible}
  .pr-table{border-collapse:separate;border-spacing:0;width:100%;font-size:7.5px;table-layout:auto;border:1px solid rgba(130,135,219,.28);border-radius:2mm;overflow:hidden}
  .pr-table thead{display:table-header-group}
  .pr-table th{background:linear-gradient(100deg,#4f438f,#37376f)!important;color:#fff!important;padding:2.2mm 1.4mm;text-align:center;font-weight:900;border:0}
  .pr-table th:first-child{border-radius:0 2mm 0 0}
  .pr-table th:last-child{border-radius:2mm 0 0 0}
  .pr-table td{border-bottom:1px solid rgba(137,150,215,.15);padding:2mm 1.4mm;text-align:center;color:#d8e0ff!important;vertical-align:middle;background:#17244b!important}
  .pr-table tbody tr:nth-child(even) td{background:#1c2a55!important}
  .pr-table tr{break-inside:avoid;page-break-inside:avoid}
  .pr-table tfoot td{background:#26396b!important;color:#bdf0db!important;font-weight:900;border:0}
  .pr-table .pr-align-right{text-align:right}
  .pr-table .pr-muted{display:block;font-size:6.6px;color:#9baad7!important;margin-top:.5mm}
  .pr-test-summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2mm;margin-bottom:3mm}
  .pr-test-chip{background:linear-gradient(145deg,#1b2852,#141f45)!important;border:1px solid rgba(127,124,228,.33);border-radius:2mm;padding:2mm 1mm;text-align:center}
  .pr-test-chip strong{display:block;font-size:11px;color:#ff9d5d!important}
  .pr-test-chip small{display:block;font-size:7px;color:#b4c0e4!important;margin-top:.5mm}
  .pr-empty{color:#b6c2e9!important}
  .pr-footer{margin-top:3mm;padding-top:2mm;border-top:1px solid rgba(154,164,225,.24);text-align:center;color:#9eacd7!important;font-size:7px}
  .pr-page-two .pr-head-main{margin-bottom:1mm}
  .pr-page-two .pr-section{margin-top:1mm}
  .pr-lesson-table{font-size:6.8px}
  .pr-lesson-table th,.pr-lesson-table td{padding:1.7mm .9mm}
  @page{size:A4 portrait;margin:8mm;background:#0b1435}
}


/* Smooth section entrance animations */
@keyframes routeViewReveal{
  0%{opacity:0;transform:translate3d(0,16px,0) scale(.988);filter:blur(2px)}
  70%{opacity:1;filter:blur(0)}
  100%{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0)}
}
@keyframes routeModalReveal{
  from{opacity:0;transform:translate3d(0,12px,0) scale(.975)}
  to{opacity:1;transform:translate3d(0,0,0) scale(1)}
}
#view-root .view-entrance-item{
  opacity:0;
  animation:routeViewReveal .48s cubic-bezier(.2,.72,.25,1) both;
  animation-delay:var(--view-delay,0ms);
  transform-origin:50% 30%;
  will-change:opacity,transform,filter;
}
#modal-root .modal-backdrop{animation:routeModalReveal .18s ease-out both}
#modal-root .modal{animation:routeModalReveal .28s cubic-bezier(.2,.72,.25,1) both}
.nav-btn{transition:color .22s ease,background .22s ease,transform .22s ease}
.nav-btn:active{transform:scale(.94)}
@media(prefers-reduced-motion:reduce){
  #view-root .view-entrance-item,#modal-root .modal-backdrop,#modal-root .modal{animation:none!important;opacity:1!important;transform:none!important;filter:none!important;will-change:auto!important}
  .nav-btn{transition:none!important}
}

function rawElapsedTimer(){const t=state.timer;if(!t)return 0;return Math.max(0,Number(t.elapsedMs)||0)+(t.running&&t.startedAt?Math.max(0,Date.now()-t.startedAt):0);}
function elapsedTimer(){return Math.min(MAX_PART_STUDY_MS,rawElapsedTimer());}
function enforceTimerPartCap(){const t=state.timer;if(!t)return false;const raw=rawElapsedTimer();if(raw<MAX_PART_STUDY_MS)return false;const needsClamp=Number(t.elapsedMs)!==MAX_PART_STUDY_MS||t.running||t.startedAt!==null;if(needsClamp){t.elapsedMs=MAX_PART_STUDY_MS;t.running=false;t.startedAt=null;saveState();notify('⚠️ سقف ۳ ساعت برای این پارت تکمیل شد؛ کرنومتر متوقف شد و زمان بیشتر به این پارت اضافه نمی‌شود.','error');}return true;}

const PUBLIC_PROFILE_FORMAT='routine-daily-public-profile';
function validStudyDayKey(key){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(key||'')))return false;const d=new Date(key+'T12:00:00Z');return Number.isFinite(d.getTime())&&d.toISOString().slice(0,10)===key;}
function cleanPublicProfile(raw){
 if(!raw||typeof raw!=='object')return null;
 const id=String(raw.id||'').trim().slice(0,100),name=String(raw.name||'').trim().slice(0,40),asOfDate=String(raw.asOfDate||'');
 if(!id||!name||!validStudyDayKey(asOfDate)||!Array.isArray(raw.days))return null;
 const minDay=addDays(asOfDate,-34),byDay=new Map();
 raw.days.slice(0,100).forEach(d=>{if(!d||!validStudyDayKey(d.dayKey)||d.dayKey<minDay||d.dayKey>asOfDate)return;const ms=Number(d.totalMs);if(!Number.isFinite(ms)||ms<0)return;byDay.set(d.dayKey,Math.min(DAILY_STUDY_CAP_MS,Math.round(ms)));});
 const days=Array.from({length:35},(_,i)=>{const dayKey=addDays(asOfDate,-34+i);return {dayKey,totalMs:byDay.get(dayKey)||0};});
 // Whitelist public rank metadata only; private study details are ignored.
 const grade=['10','11','12'].includes(String(raw.grade))?String(raw.grade):'';
 const track=['math','experimental','humanities','islamic','technical','kardanish'].includes(raw.track)?raw.track:'';
 const specialty=track==='technical'||track==='kardanish'?String(raw.specialty||'').trim().slice(0,65):'';
 return {id,name,asOfDate,days,grade,track,specialty};
}
function cleanStudyGroupMember(raw){
 if(!raw||typeof raw!=='object')return null;
 const id=String(raw.id||'').trim().slice(0,100),name=String(raw.name||'').trim().slice(0,40),asOfDate=String(raw.asOfDate||'');
 if(!id||!name||!validStudyDayKey(asOfDate)||!Array.isArray(raw.days))return null;
 const minDay=addDays(asOfDate,-(STUDY_GROUP_HISTORY_DAYS-1)),byDay=new Map();
 raw.days.slice(0,100).forEach(d=>{if(!d||!validStudyDayKey(d.dayKey)||d.dayKey<minDay||d.dayKey>asOfDate)return;const ms=Number(d.totalMs);if(!Number.isFinite(ms)||ms<0)return;byDay.set(d.dayKey,Math.min(DAILY_STUDY_CAP_MS,Math.round(ms)));});
 const days=Array.from({length:STUDY_GROUP_HISTORY_DAYS},(_,i)=>{const dayKey=addDays(asOfDate,-(STUDY_GROUP_HISTORY_DAYS-1)+i);return {dayKey,totalMs:byDay.get(dayKey)||0};});
 const grade=['10','11','12'].includes(String(raw.grade))?String(raw.grade):'';
 const track=['math','experimental','humanities','islamic','technical','kardanish'].includes(raw.track)?raw.track:'';
 const specialty=track==='technical'||track==='kardanish'?String(raw.specialty||'').trim().slice(0,65):'';
 return {id,name,asOfDate,days,grade,track,specialty,updatedAt:Number.isFinite(Number(raw.updatedAt))?Number(raw.updatedAt):Date.now()};
}
function cleanStudyGroup(raw){
 if(!raw||typeof raw!=='object')return null;
 const id=String(raw.id||'').trim().slice(0,100),name=String(raw.name||'').trim().slice(0,50),code=String(raw.code||'').trim().toUpperCase().slice(0,16),ownerId=String(raw.ownerId||'').trim().slice(0,100);
 if(!id||!name||!/^[A-Z0-9-]{5,16}$/.test(code)||!ownerId)return null;
 const members=Array.isArray(raw.members)?raw.members.map(cleanStudyGroupMember).filter(Boolean).slice(0,STUDY_GROUP_MAX_MEMBERS):[];
 const unique=[...new Map(members.map(m=>[m.id,m])).values()];
 return {id,name,code,ownerId,createdAt:Number.isFinite(Number(raw.createdAt))?Number(raw.createdAt):Date.now(),localRole:raw.localRole==='owner'?'owner':'member',members:unique,updatedAt:Number.isFinite(Number(raw.updatedAt))?Number(raw.updatedAt):Date.now()};
}
function ensureStudyMemberId(){if(!state.studyMemberId){state.studyMemberId=(crypto.randomUUID&&crypto.randomUUID())||('member-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10));saveState();}return state.studyMemberId;}
function makeStudyGroupMemberSnapshot(){
 const asOfDate=dateKey(),days=[];for(let i=STUDY_GROUP_HISTORY_DAYS-1;i>=0;i--){const dayKey=addDays(asOfDate,-i);days.push({dayKey,totalMs:Math.min(DAILY_STUDY_CAP_MS,sum(studyDaySessions(dayKey),x=>x.totalMs))});}
 return cleanStudyGroupMember({id:ensureStudyMemberId(),name:state.displayName||'دانش‌آموز',grade:state.schoolGrade||'12',track:ACTIVE_TRACK,specialty:state.specialty||'',asOfDate,days,updatedAt:Date.now()});
}
function getStudyGroupMembers(group){
 const map=new Map((group.members||[]).map(x=>[x.id,cleanStudyGroupMember(x)]).filter(x=>x[1]));
 const own=makeStudyGroupMemberSnapshot();map.set(own.id,own);
 return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'fa'));
}
function studyGroupMetrics(group){
 const members=getStudyGroupMembers(group),today=dateKey(),start=addDays(today,-(STUDY_GROUP_HISTORY_DAYS-1));
 const daily=new Map();let totalMs=0;
 members.forEach(member=>member.days.forEach(day=>{if(day.dayKey<start||day.dayKey>today)return;totalMs+=day.totalMs;if(day.totalMs>0)daily.set(day.dayKey,(daily.get(day.dayKey)||0)+1);}));
 let cursor=today,streak=0;if(!daily.has(cursor))cursor=addDays(cursor,-1);while(daily.has(cursor)&&streak<STUDY_GROUP_HISTORY_DAYS){streak++;cursor=addDays(cursor,-1);}
 const memberRows=members.map(m=>({member:m,totalMs:sum(m.days.filter(d=>d.dayKey>=start&&d.dayKey<=today),d=>d.totalMs),rankMetrics:publicProfileMetrics(m)})).sort((a,b)=>b.rankMetrics.streak-a.rankMetrics.streak||b.rankMetrics.weekMs-a.rankMetrics.weekMs||b.rankMetrics.weekDays-a.rankMetrics.weekDays||b.totalMs-a.totalMs||a.member.name.localeCompare(b.member.name,'fa'));
 return {members,memberRows,totalMs,averagePerMember:members.length?totalMs/members.length:0,streak,activeToday:members.filter(m=>m.days.some(d=>d.dayKey===today&&d.totalMs>0)).length,start,today};
}
function makeGroupCode(){const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let out='';if(crypto?.getRandomValues){const bytes=new Uint8Array(8);crypto.getRandomValues(bytes);for(let i=0;i<8;i++)out+=alphabet[bytes[i]%alphabet.length];}else{for(let i=0;i<8;i++)out+=alphabet[Math.floor(Math.random()*alphabet.length)];}return out;}

function mergeStudyGroup(existing,incoming,role){
 const base=existing||incoming,byId=new Map();[...(existing?.members||[]),...(incoming.members||[])].forEach(x=>{const m=cleanStudyGroupMember(x);if(!m)return;const prev=byId.get(m.id);if(!prev||m.updatedAt>=prev.updatedAt)byId.set(m.id,m);});
 const cleaned=cleanStudyGroup({...base,...incoming,localRole:existing?.localRole||role||incoming.localRole,members:[...byId.values()],updatedAt:Date.now()});return cleaned;
}
function importStudyGroupFile(file){
 const reader=new FileReader();reader.onerror=()=>notify('خواندن فایل گروه انجام نشد.','error');reader.onload=()=>{
  try{
   const payload=JSON.parse(reader.result);if(payload?.version!==1)throw new Error('version');ensureStudyMemberId();
   if(payload.format===STUDY_GROUP_MEMBER_FORMAT){
    const groupId=String(payload.group?.id||''),group=groupById(groupId),code=String(payload.group?.code||'').toUpperCase(),member=cleanStudyGroupMember(payload.member);
    if(!group||group.code!==code||!member)throw new Error('member report');
    if(member.id===ensureStudyMemberId()){notify('این گزارش متعلق به همین کاربر است و نیازی به واردکردن آن نیست.','error');return;}
    const incoming={...group,members:[...(group.members||[]).filter(m=>m.id!==member.id),member],updatedAt:Date.now()};state.studyGroups=state.studyGroups.map(g=>g.id===group.id?mergeStudyGroup(g,incoming):g);saveState();render();notify(`گزارش مطالعه «${member.name}» به گروه اضافه شد.`);return;
   }
   if(payload.format===STUDY_GROUP_INVITE_FORMAT||payload.format===STUDY_GROUP_SNAPSHOT_FORMAT){
    const incoming=cleanStudyGroup({...payload.group,localRole:payload.group?.ownerId===state.studyMemberId?'owner':'member'});if(!incoming)throw new Error('group');
    const existing=groupById(incoming.id);if(existing&&existing.code!==incoming.code)throw new Error('code');
    const merged=mergeStudyGroup(existing,incoming,incoming.localRole);state.studyGroups=[...(state.studyGroups||[]).filter(g=>g.id!==merged.id),merged].slice(0,50);saveState();render();
    notify(payload.format===STUDY_GROUP_INVITE_FORMAT?`به گروه «${merged.name}» پیوستی. برای ثبت حضورت، گزارش خودت را برای مدیر گروه بفرست.`:`اطلاعات گروه «${merged.name}» به‌روزرسانی شد.`);return;
   }
   throw new Error('format');
  }catch(e){notify('فایل معتبر گروه نیست یا به گروهی تعلق ندارد که عضو آن باشی.','error');}
 };reader.readAsText(file);
}

esc(group.id)}">🔄 خروجی به‌روزرسانی گروه</button><button class="btn btn-red btn-sm" data-action="remove-study-group-confirm" data-group-id="${esc(group.id)}">حذف از این دستگاه</button></div></article>`;}).join('');
 return `<section class="panel study-groups-panel"><div class="section-head" style="margin-top:0"><div><h3>گروه‌های مطالعاتی 👥</h3><small>همراهی دوستان و مشاهده آمار مشترک</small></div><span class="study-group-symbol">🤝</span></div><div class="study-groups-intro">برای تشکیل گروه، یک نفر گروه را می‌سازد و فایل دعوت را می‌فرستد. هر عضو فایل دعوت را وارد می‌کند و در صورت تمایل گزارش زمان مطالعه‌اش را صادر می‌کند. مدیر گروه گزارش‌ها را وارد می‌کند و فایل به‌روزرسانی گروه را برای اعضا می‌فرستد.</div><div class="study-groups-toolbar"><button class="btn btn-primary btn-sm" data-action="create-study-group">＋ ساخت گروه</button><button class="btn btn-soft btn-sm" data-action="import-study-group-file">📥 پیوستن / دریافت گزارش</button><input class="hidden" type="file" accept="application/json,.json" id="study-group-import-file"></div>${cards||'<div class="empty-state study-group-empty"><div class="emoji">👥</div><strong>هنوز عضو هیچ گروه مطالعاتی نیستی</strong><div class="tiny">یک گروه بساز یا فایل دعوتی را که از دوستانت گرفته‌ای وارد کن.</div></div>'}<div class="study-group-privacy"><b>حریم خصوصی و نحوه همگام‌سازی</b><p>فایل‌های گروه فقط شامل نام نمایشی، پایه، رشته و مدت مطالعه روزانه ۳۵ روز اخیر هستند؛ عکس پروفایل، تعداد تست، درصد پاسخ‌گویی، نام درس‌ها، گزارش و عملکرد شخصی ارسال نمی‌شود. این نسخه سرور مشترک ندارد، پس دعوت و به‌روزرسانی اعضا با جابه‌جایی فایل انجام می‌شود و آمار زنده نیست.</p><small>پیوستگی گروهی یعنی تعداد روزهای پیاپی که دست‌کم یک عضو گروه مطالعه ثبت کرده باشد.</small></div></section>`;
}
function makeMyPublicProfile(){
 if(!state.leaderboardId)return null;
 const asOfDate=dateKey(),days=[];
 for(let i=34;i>=0;i--){const dayKey=addDays(asOfDate,-i);days.push({dayKey,totalMs:Math.min(DAILY_STUDY_CAP_MS,sum(studyDaySessions(dayKey),x=>x.totalMs))});}
 return cleanPublicProfile({id:state.leaderboardId,name:state.displayName||'دانش‌آموز',grade:state.schoolGrade||'12',track:ACTIVE_TRACK,specialty:state.specialty||'',asOfDate,days});
}
function publicProfileMetrics(profile){
 const map=new Map(profile.days.map(d=>[d.dayKey,d.totalMs]));
 const studied=k=>(map.get(k)||0)>0;
 let cursor=profile.asOfDate,streak=0;
 if(!studied(cursor))cursor=addDays(cursor,-1);
 while(studied(cursor)&&streak<35){streak++;cursor=addDays(cursor,-1);}
 const weekStartKey=addDays(profile.asOfDate,-6),weekDays=profile.days.filter(d=>d.dayKey>=weekStartKey&&d.dayKey<=profile.asOfDate&&d.totalMs>0);
 return {streak,weekMs:sum(weekDays,d=>d.totalMs),weekDays:weekDays.length};
}
function makeLocalRankProfile(){
 const asOfDate=dateKey(),days=[];for(let i=34;i>=0;i--){const dayKey=addDays(asOfDate,-i);days.push({dayKey,totalMs:Math.min(DAILY_STUDY_CAP_MS,sum(studyDaySessions(dayKey),x=>x.totalMs))});}
 const id=state.leaderboardId||('local-rank-'+ensureStudyMemberId());
 return cleanPublicProfile({id,name:state.displayName||'دانش‌آموز',grade:state.schoolGrade||'12',track:ACTIVE_TRACK,specialty:state.specialty||'',asOfDate,days});
}
function rankSortProfiles(profiles){return profiles.map(profile=>({profile,metrics:publicProfileMetrics(profile)})).sort((a,b)=>b.metrics.streak-a.metrics.streak||b.metrics.weekMs-a.metrics.weekMs||b.metrics.weekDays-a.metrics.weekDays||a.profile.name.localeCompare(b.profile.name,'fa'));}
function rankSummaryFor(profiles,matcher,selfId){
 const ranked=rankSortProfiles(profiles.filter(matcher));
 const index=ranked.findIndex(x=>x.profile.id===selfId);
 return {position:index>=0?index+1:null,total:ranked.length,ranked};
}
function myRankOverview(){
 const own=makeLocalRankProfile(),selfId=own.id;
 const peers=(state.leaderboardProfiles||[]).map(cleanPublicProfile).filter(Boolean).filter(p=>p.id!==selfId);
 const all=[own,...peers];
 const gradeRank=rankSummaryFor(all,p=>p.grade===String(state.schoolGrade||'12'),selfId);
 const fieldRank=rankSummaryFor(all,p=>p.track===ACTIVE_TRACK&&(!isSpecialtyTrack(ACTIVE_TRACK)||String(p.specialty||'').trim()===String(state.specialty||'').trim()),selfId);
 const groupRanks=(state.studyGroups||[]).map(group=>{const m=studyGroupMetrics(group),rank=m.memberRows.findIndex(x=>x.member.id===state.studyMemberId)+1;return {group,rank:rank||null,total:m.memberRows.length,memberRows:m.memberRows};});
 return {own,gradeRank,fieldRank,groupRanks};
}
function renderMyRankOverview(){
 const r=myRankOverview(),rankText=x=>x.position?`رتبه ${fa(x.position)} از ${fa(x.total)}`:'هنوز رتبه‌ای ثبت نشده';
 const fieldLabel=isSpecialtyTrack(ACTIVE_TRACK)?`${trackLabel()} · ${state.specialty||'تخصص تعیین‌نشده'}`:trackLabel();
 const groupCards=r.groupRanks.length?r.groupRanks.map(x=>`<div class="my-rank-group-row"><div><b>👥 ${esc(x.group.name)}</b><small>${fa(x.total)} عضو · معیار: پیوستگی و ساعت مطالعه</small></div><strong>${x.rank?`#${fa(x.rank)}`:'—'}</strong></div>`).join(''):'<div class="muted tiny">برای دیدن رتبه گروهی، ابتدا عضو یک گروه مطالعاتی شو.</div>';
 return `<section class="panel my-rank-panel"><div class="section-head" style="margin-top:0"><div><h3>رتبه‌های من 🏅</h3><small>مقایسه بر اساس پیوستگی و ساعت مطالعه ۷ روز اخیر</small></div><span class="leaderboard-cup">🏆</span></div><div class="my-rank-grid"><div class="my-rank-card"><small>رتبه در پایه ${state.schoolGrade==='10'?'دهم':state.schoolGrade==='11'?'یازدهم':'دوازدهم'}</small><strong>${r.gradeRank.position?`#${fa(r.gradeRank.position)}`:'—'}</strong><span>${fa(r.gradeRank.total)} نفر در این پایه</span></div><div class="my-rank-card"><small>رتبه در رشته</small><strong>${r.fieldRank.position?`#${fa(r.fieldRank.position)}`:'—'}</strong><span>${esc(fieldLabel)} · ${fa(r.fieldRank.total)} نفر</span></div></div><div class="my-rank-group-list"><div class="section-head" style="margin:12px 0 5px"><b>رتبه در گروه‌ها</b><small>${fa(r.groupRanks.length)} گروه</small></div>${groupCards}</div><p class="muted tiny my-rank-note">رتبهٔ پایه و رشته از پروفایل‌هایی محاسبه می‌شود که فایل رتبه‌بندی آن‌ها را وارد کرده‌ای. برای مقایسه درست، دوستان باید نسخه جدید را داشته باشند و پایه و رشته خود را در تنظیمات ثبت کنند. اطلاعات شخصی مثل تست‌ها و نام درس‌ها وارد رتبه‌بندی نمی‌شود.</p></section>`;
}
function leaderboardEntries(){
 const imported=(state.leaderboardProfiles||[]).map(cleanPublicProfile).filter(Boolean).filter(p=>p.id!==state.leaderboardId);
 const own=state.leaderboardOptIn?cleanPublicProfile(makeMyPublicProfile()):null;
 return [...(own?[own]:[]),...imported].map(profile=>({profile,metrics:publicProfileMetrics(profile),isMe:!!own&&profile.id===own.id}))
  .sort((a,b)=>b.metrics.streak-a.metrics.streak||b.metrics.weekMs-a.metrics.weekMs||b.metrics.weekDays-a.metrics.weekDays||a.profile.name.localeCompare(b.profile.name,'fa'));
}
function activateMyLeaderboardProfile(){
 if(!state.displayName||state.displayName.trim()===''||state.displayName==='دانش‌آموز'){
  notify('ابتدا در تنظیمات یک نام نمایشی یا نام مستعار برای خودت انتخاب کن.','error');nav('settings');return;
 }
 state.leaderboardId=state.leaderboardId||((crypto.randomUUID&&crypto.randomUUID())||('local-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10)));
 state.leaderboardOptIn=true;saveState();render();notify('نمایه عمومی محلی فعال شد؛ اطلاعات فقط با فایل خروجی به اشتراک گذاشته می‌شود.');

function exportMyPublicProfile(){
 if(!state.leaderboardOptIn){notify('ابتدا نمایش نمایه عمومی را فعال کن.','error');return;}
 const profile=makeMyPublicProfile();if(!profile){notify('ساخت نمایه انجام نشد.','error');return;}
 const payload={format:PUBLIC_PROFILE_FORMAT,version:1,profile};
 downloadFile('routine-daily-public-profile.json',JSON.stringify(payload,null,2),'application/json');
 notify('فایل اشتراک‌گذاری آماده شد؛ فقط نام نمایشی و زمان روزانه در آن است.');
}
function importPublicProfileFile(file){
 const reader=new FileReader();reader.onerror=()=>notify('خواندن فایل انجام نشد.','error');reader.onload=()=>{
  try{
   const payload=JSON.parse(reader.result);
   if(payload?.format!==PUBLIC_PROFILE_FORMAT||payload?.version!==1)throw new Error('format');
   const profile=cleanPublicProfile(payload.profile);
   if(!profile)throw new Error('profile');
   if(profile.id===state.leaderboardId){notify('این فایل مربوط به نمایه خودت است.','error');return;}
   const others=(state.leaderboardProfiles||[]).filter(x=>x.id!==profile.id);
   if(others.length>=100&&!state.leaderboardProfiles.some(x=>x.id===profile.id)){notify('حداکثر ۱۰۰ نمایه قابل نگهداری است.','error');return;}
   state.leaderboardProfiles=[...others,profile];saveState();render();notify(`نمایه «${profile.name}» وارد شد؛ در صورت ثبت پایه و رشته، در رتبه‌بندی‌های مربوط محاسبه می‌شود.`);
  }catch(e){notify('فایل معتبر نیست یا قالب آن پشتیبانی نمی‌شود.','error');}
 };
 reader.readAsText(file);
}

 const consent=state.leaderboardOptIn?`<div class="leaderboard-consent active"><div><strong>نمایه عمومی این دستگاه فعال است</strong><small>برای اضافه‌شدن به فایل رتبه‌بندی دوستان، فایل پروفایل خودت را صادر و برایشان ارسال کن.</small></div><div class="leaderboard-actions"><button class="btn btn-primary btn-sm" data-action="export-public-profile">📤 خروجی پروفایل من</button><button class="btn btn-soft btn-sm" data-action="disable-public-profile">غیرفعال‌سازی</button></div></div>`:`<div class="leaderboard-consent"><div><strong>نمایش اختیاری پروفایل من</strong><small>با فعال‌سازی، نام نمایشی، پایه، رشته و مدت مطالعه روزانه ۳۵ روز اخیر در فایل خروجی قرار می‌گیرد. تست‌ها، درس‌ها و گزارش شخصی ارسال نمی‌شود. بهتر است از نام مستعار استفاده کنی.</small></div><button class="btn btn-primary btn-sm" data-action="enable-public-profile">فعال‌سازی با رضایت من</button></div>`;
 return `<div class="report-banner leaderboard-banner"><div><h2>رتبه‌بندی مطالعه 🏆</h2><p>رتبه در پایه، رشته و گروه‌های مطالعاتی</p></div><div class="brand-mark">🏆</div></div>${renderMyRankOverview()}<section class="panel leaderboard-info"><strong>حریم خصوصی و نحوه همگام‌سازی</strong><p>این نسخه اطلاعات را فقط در مرورگر نگه می‌دارد و به سرور مشترک وصل نیست؛ بنابراین رتبه‌بندی زنده بین دستگاه‌ها فعال نیست. برای رتبه پایه و رشته، فایل پروفایل جدید دوستانت را دریافت و در همین بخش وارد کن. برای رتبه گروهی نیز فایل گزارش گروهی را به‌روزرسانی کن. فایل عمومی فقط شامل نام نمایشی، پایه، رشته و زمان مطالعه روزانه است و هیچ‌وقت تعداد تست، درصد، نام درس‌ها، گزارش یا عملکرد مطالعاتی را شامل نمی‌شود.</p></section>${consent}<section class="panel leaderboard-panel"><div class="section-head" style="margin-top:0"><div><h3>جدول رتبه‌بندی</h3><small>${fa(entries.length)} نمایه در این دستگاه</small></div><span class="leaderboard-cup">🏅</span></div>${list}</section><section class="panel leaderboard-import"><div><h3>افزودن نمایه دوستان</h3><p class="muted tiny">فایل JSON پروفایل عمومی که دوستت از همین بخش گرفته را انتخاب کن. فقط اطلاعات مجاز وارد می‌شود.</p></div><label for="leaderboard-import-file" class="btn btn-soft btn-sm">📥 وارد کردن فایل دوست</label><input type="file" accept="application/json,.json" id="leaderboard-import-file" class="hidden"><div class="tiny muted">فایل‌ها فقط روی این دستگاه ذخیره می‌شوند و ارسال خودکار ندارند.</div></section><button class="btn btn-soft btn-block" style="margin-top:12px" data-action="back-to-streak">بازگشت به باشگاه پیوستگی</button>`;
}
function renderStreak(){const today=dateKey();const keys=Array.from({length:35},(_,i)=>addDays(today,-34+i));const first=new Date(keys[0]+'T12:00:00Z');const cells=keys.map(k=>`<button type="button" class="day-cell ${hasStudy(k)?'done':''} ${hasEarlyStudy(k)?'early':''} ${k===today?'today':''}" data-action="streak-day" data-day-key="${k}" title="${faDate(k)} · ${hasStudy(k)?'مطالعه ثبت شده':'بدون ثبت'}" aria-label="${dayName(k)} ${faDate(k)}؛ مشاهده یا ثبت مطالعه">${fa(+k.slice(8))}</button>`).join('');return `<div class="report-banner" style="margin-bottom:13px"><div><h2>باشگاه پیوستگی 🌿</h2><p>با هر روز مطالعه، یک خانه از مسیرت روشن می‌شود.</p></div><div class="brand-mark">🏅</div></div><section class="panel leaderboard-shortcut"><div><strong>رتبه‌بندی کاربران</strong><small>مقایسه پیوستگی و ساعت مطالعه با حفظ حریم خصوصی</small></div><button class="btn btn-primary btn-sm" data-action="open-leaderboard">🏆 مشاهده رتبه‌بندی</button></section>${renderStudyGroupsPanel()}<div class="streak-cards"><div class="streak-card"><strong>${fa(streakCount())}</strong><span>پیوستگی فعلی</span></div><div class="streak-card"><strong>${fa(getStudyDays().length)}</strong><span>روزهای مطالعه‌شده</span></div><div class="streak-card"><strong>${fa(streakCount(true))}</strong><span>سحرخیزی متوالی</span></div></div><section class="panel"><div class="section-head" style="margin-top:0"><h3>مسیر ۳۵ روز اخیر</h3><small>${faDate(keys[0])} تا ${faDate(today)}</small></div><p class="muted tiny" style="margin:0 0 10px">برای مشاهدهٔ پارت‌های ثبت‌شده یا افزودن مطالعه به روزهای گذشته، روی همان روز بزن.</p><div class="month-grid">${cells}</div><div class="day-legend"><span><i class="legend-dot"></i> مطالعه ثبت شده</span><span><i class="legend-dot red"></i> بدون ثبت</span><span><i class="legend-dot gold"></i> شروع مطالعه بین ۵ تا ۹</span></div></section><section class="panel"><div class="section-head" style="margin-top:0"><h3>سه قدم امروز</h3></div><div class="grid grid-3"><div class="stat"><span class=" function openStreakDayModal(key){

function persianMonthToken(key){
 const parts=new Intl.DateTimeFormat('en-US-u-ca-persian',{timeZone:'UTC',year:'numeric',month:'numeric'}).formatToParts(new Date(key+'T12:00:00Z'));
 const year=parts.find(x=>x.type==='year')?.value||'0';
 const month=parts.find(x=>x.type==='month')?.value||'0';
 return `${year}-${String(month).padStart(2,'0')}`;
}
function persianMonthLabel(key){return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{timeZone:'UTC',year:'numeric',month:'long'}).format(new Date(key+'T12:00:00Z'));}
function shiftedPersianMonthKey(offset){
 let key=dateKey(),token=persianMonthToken(key),direction=offset>=0?-1:1;
 for(let n=0;n<Math.min(240,Math.abs(offset));n++){
  let cursor=key,guard=0;
  do{cursor=addDays(cursor,direction);guard++;}while(persianMonthToken(cursor)===token&&guard<40);
  key=cursor;token=persianMonthToken(key);
 }
 return key;
}
function sharePeriodData(){
 const period=['day','week','month'].includes(state.statsPeriod)?state.statsPeriod:'day';
 let sessions=[],label='',subtitle='';
 if(period==='day'){
  const offset=Math.max(0,Math.min(10000,Number(state.statsDayOffset)||0));
  const key=addDays(dateKey(),-offset);sessions=state.sessions.filter(x=>x.dayKey===key);
  label=offset===0?'امروز':dayName(key);subtitle=faDate(key);
 }else if(period==='week'){
  const offset=Math.max(0,Math.min(1000,Number(state.reportWeekOffset)||0));
  const start=addDays(weekStart(),-7*offset),end=addDays(start,7);
  sessions=state.sessions.filter(x=>x.dayKey>=start&&x.dayKey<end);
  label=offset===0?'این هفته':`${fa(offset)} هفته قبل`;subtitle=`${faDate(start)} تا ${faDate(addDays(end,-1))}`;
 }else{
  const offset=Math.max(0,Math.min(240,Number(state.statsMonthOffset)||0));
  const anchor=shiftedPersianMonthKey(offset),token=persianMonthToken(anchor);
  sessions=state.sessions.filter(x=>persianMonthToken(x.dayKey)===token);
  label=offset===0?'این ماه':persianMonthLabel(anchor);subtitle=persianMonthLabel(anchor);
 }
 const rows=SUBJECTS.map(subject=>({subject,ms:sum(sessions.filter(x=>x.subject===subject.name),x=>x.totalMs)}))
  .filter(x=>x.ms>0).sort((a,b)=>b.ms-a.ms);
 return {period,sessions,label,subtitle,rows,total:sum(rows,x=>x.ms)};
}
function renderSubjectSharePanel(){
 const data=sharePeriodData(),circ=2*Math.PI*66;let offset=0;
 const segments=data.total?data.rows.map(row=>{
  const pct=row.ms/data.total,arc=circ*pct,start=offset;offset+=arc;
  const labelAngle=(-90+(start+arc/2)/circ*360)*Math.PI/180;
  const labelX=90+62*Math.cos(labelAngle),labelY=90+62*Math.sin(labelAngle);
  return `<circle cx="90" cy="90" r="66" fill="none" stroke="${row.subject.color}" stroke-width="25" stroke-dasharray="${arc.toFixed(2)} ${(circ-arc).toFixed(2)}" stroke-dashoffset="-${start.toFixed(2)}" transform="rotate(-90 90 90)"/>${pct>=.075?`<text x="${labelX.toFixed(1)}" y="${(labelY+3).toFixed(1)}" text-anchor="middle" class="share-segment-label">${fa(Math.round(pct*100))}٪</text>`:''}`;
 }).join(''):`<circle cx="90" cy="90" r="66" fill="none" stroke="var(--line)" stroke-width="25"/>`;
 const legend=data.rows.length?data.rows.map(row=>{
  const pct=data.total?row.ms/data.total*100:0;
  return `<div class="share-legend-row"><i style="background:${row.subject.color}"></i><strong title="${esc(row.subject.name)}">${esc(row.subject.name)}</strong><span>${fmtDuration(row.ms)}</span><b>${fa(pct.toFixed(1))}٪</b></div>`;
 }).join(''):`<div class="share-empty">در این بازه هنوز مطالعه‌ای ثبت نشده است.</div>`;
 const active=p=>data.period===p?'active':'';
 const offsetValue=data.period==='day'?(Number(state.statsDayOffset)||0):data.period==='week'?(Number(state.reportWeekOffset)||0):(Number(state.statsMonthOffset)||0);
 return `<section class="panel share-panel"><div class="section-head" style="margin-top:0"><div><h3>سهم هر درس از زمان مطالعه</h3><small>درصد زمان اختصاص‌یافته به هر درس</small></div><span class="share-total">${fmtDuration(data.total)}</span></div><div class="share-period-tabs"><button class="${active('day')}" data-action="share-period" data-period="day">روز</button><button class="${active('week')}" data-action="share-period" data-period="week">هفته</button><button class="${active('month')}" data-action="share-period" data-period="month">ماه</button></div><div class="share-period-nav"><button data-action="share-period-prev" aria-label="بازه قبل">‹</button><div><strong>${data.label}</strong><small>${data.subtitle}</small></div><button data-action="share-period-next" ${offsetValue===0?'disabled':''} aria-label="بازه بعد">›</button></div><div class="share-content"><div class="share-donut"><svg viewBox="0 0 180 180" role="img" aria-label="نمودار سهم درس‌ها">${segments}<circle cx="90" cy="90" r="48" fill="var(--panel)"/><text x="90" y="85" text-anchor="middle" class="share-center-title">مطالعه کل</text><text x="90" y="105" text-anchor="middle" class="share-center-value">${fmtHM(data.total)}</text></svg></div><div class="share-legend">${legend}</div></div></section>`;
}

function renderPlanDetailsModal(){const d=planDraft,subject=d.subject||defaultStudySubject(),grade=d.grade||defaultGradeForSubject(subject,'12');const tests=!!d.tests;return `<div class="modal-head"><div><h3>جزئیات پارت برنامه‌ریزی‌شده</h3><div class="muted tiny">${WEEK_DAYS.find(x=>String(x.key)===String(d.dayKey))?.label||'روز'} · ${planClock(d.startHour,d.startMinute)} تا ${planClock(d.endHour,d.endMinute)}</div></div><button class="close-btn" data-action="close-modal">×</button></div><form id="plan-details-form"><div class="form-grid"><div class="field"><label for="plan-subject">چه درسی؟</label><select id="plan-subject">${SUBJECTS.map(x=>`<option ${x.name===subject?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label for="plan-grade">پایهٔ تحصیلی</label><select id="plan-grade">${renderGradeOptions(subject,grade)}</select></div><div class="field full" id="plan-chapter-wrap">${renderPlanChapterField(subject,grade,d.chapter||'')}</div><div class="field full"><label for="plan-topic">چه مبحثی؟</label><input id="plan-topic" maxlength="120" placeholder="مثلاً: معادله درجه دوم" value="${esc(d.topic||'')}"></div><div class="field full"><label>حل تست؟</label><div class="type-chips"><button type="button" class="type-chip ${tests?'':'selected'}" data-action="plan-test-choice" data-value="no" id="plan-test-no">خیر</button><button type="button" class="type-chip ${tests?'selected':''}" data-action="plan-test-choice" data-value="yes" id="plan-test-yes">بله</button></div></div><div class="field full ${tests?'':'hidden'}" id="plan-test-count-wrap"><label for="plan-test-count">تعداد تست موردنیاز</label><input id="plan-test-count" type="number" min="1" max="10000" step="1" value="${d.testCount||20}" placeholder="مثلاً ۳۰"></div><div class="field full"><label>حل سؤال تشریحی؟</label><div class="type-chips"><button type="button" class="type-chip ${d.essay?'':'selected'}" data-action="plan-essay-choice" data-value="no" id="plan-essay-no">خیر</button><button type="button" class="type-chip ${d.essay?'selected':''}" data-action="plan-essay-choice" data-value="yes" id="plan-essay-yes">بله</button></div></div></div><div id="plan-details-error" class="form-error" style="margin-top:8px"></div><div class="modal-actions"><button class="btn btn-primary" type="submit">ذخیره در برنامه</button><button class="btn btn-soft" type="button" data-action="plan-time-back">بازگشت به زمان</button></div></form>`;}
function renderPlannedSchedule(){const blocks=Array.isArray(state.plannedBlocks)?state.plannedBlocks:[];return `<div class="weekly-schedule-block"><div class="section-head" style="margin-top:0"><div><h3>برنامه‌ریزی پارت‌های مطالعه</h3><small>برای هر روز، ساعت و موضوع هر پارت را جداگانه مشخص کن</small></div><button class="btn btn-primary btn-sm" data-action="add-planned-block">＋ افزودن پارت</button></div><p class="small muted" style="margin:0 0 12px">برای هر پارت، زمان شروع و پایان را با اسلایدر تعیین کن؛ سپس درس، فصل، مبحث و هدف تستی یا تشریحی را ثبت کن.</p>${blocks.length?`<div class="planned-block-list">${WEEK_DAYS.map(day=>{const dayBlocks=blocks.filter(x=>String(x.dayKey)===String(day.key)).sort((a,b)=>(a.startHour*60+a.startMinute)-(b.startHour*60+b.startMinute));return dayBlocks.length?`<div class="planned-day-group"><strong>${day.label}</strong>${dayBlocks.map(x=>`<article class="planned-block-card"><div class="planned-block-time">${planClock(x.startHour,x.startMinute)} – ${planClock(x.endHour,x.endMinute)}${x.endHour*60+x.endMinute<x.startHour*60+x.startMinute?' · روز بعد':''}</div><div class="planned-block-info"><b>${esc(x.subject)}</b><span>${esc(x.chapter||'—')}${x.topic?' · '+esc(x.topic):''}</span><small>${x.tests?`🎯 ${fa(x.testCount)} تست`: 'بدون تست'} · ${x.essay?'سؤال تشریحی':'بدون سؤال تشریحی'}</small></div><button class="btn btn-red btn-sm" data-action="delete-planned-block" data-id="${esc(x.id)}" aria-label="حذف پارت">حذف</button></article>`).join('')}</div>`:''}).join('')}</div>`:`<div class="empty-state" style="padding:15px"><strong>هنوز پارت برنامه‌ریزی‌شده‌ای ثبت نکرده‌ای</strong><div class="tiny">با «افزودن پارت» اولین بازهٔ مطالعه‌ات را بساز.</div></div>`}</div>`;}
function updatePlanChapterOptions(){if(!planDraft)return;const subject=document.getElementById('plan-subject')?.value||defaultStudySubject(),grade=document.getElementById('plan-grade')?.value||defaultGradeForSubject(subject,'12');const current=document.getElementById('plan-chapter')?.value||'';const wrap=document.getElementById('plan-chapter-wrap');if(wrap)wrap.innerHTML=renderPlanChapterField(subject,grade,current);}

function savePlannedBlock(){const subject=document.getElementById('plan-subject').value;const grade=defaultGradeForSubject(subject,document.getElementById('plan-grade').value);const chapter=document.getElementById('plan-chapter').value;const topic=document.getElementById('plan-topic').value.trim();const tests=document.getElementById('plan-test-yes').classList.contains('selected');const essay=document.getElementById('plan-essay-yes').classList.contains('selected');let testCount=0;if(tests){testCount=Number(document.getElementById('plan-test-count').value);if(!Number.isInteger(testCount)||testCount<1||testCount>10000){const err=document.getElementById('plan-details-error');if(err)err.textContent='تعداد تست موردنیاز باید بین ۱ تا ۱۰٬۰۰۰ باشد.';return;}}
 const block={id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),dayKey:Number(planDraft.dayKey),startHour:planDraft.startHour,startMinute:planDraft.startMinute,endHour:planDraft.endHour,endMinute:planDraft.endMinute,subject,grade,chapter,topic,tests,testCount,essay};state.plannedBlocks.push(block);saveState();planDraft=null;closeModal();render();notify('پارت به برنامه روزانه اضافه شد.');}
function renderGuide(){return `
<div class="guide-wrap">
 <section class="guide-hero">

  <h2>راهنمای استفاده از مسیر مطالعه</h2>
  <p>از اولین ثبت مطالعه تا تحلیل گزارش هفتگی، گروه‌های مطالعاتی و گرفتن خروجی PDF؛ مراحل کار با سایت در این راهنما توضیح داده شده است.</p>
  <div class="guide-quick-grid">
   <button class="guide-quick" data-view="dashboard"><span>🏠</span>شروع و ثبت مطالعه</button>
   <button class="guide-quick" data-view="report"><span>📊</span>آمار و گزارش‌ها</button>

   <button class="guide-quick" data-view="settings"><span>⚙️</span>تنظیمات</button>
  </div>
 </section>
 <details class="guide-section" open><summary><span class="guide-number">۱</span>ورود اولیه، انتخاب رشته و آشنایی با صفحه خانه</summary><div class="guide-content">
  <p>در نخستین ورود، شاخه و رشته تحصیلی را انتخاب کن. سایت فهرست درس‌ها را بر اساس انتخابت مرتب می‌کند. در رشته‌های فنی‌وحرفه‌ای و کاردانش ممکن است نام رشته یا تخصص هم لازم باشد.</p>
  <ul><li><b>صفحه خانه 🏠:</b> هدف امروز، مدت مطالعه کل و مفید، تعداد پارت‌ها، درصد پیشرفت هدف و فهرست درس‌ها را نشان می‌دهد.</li><li><b>شروع مطالعه:</b> دکمه «شروع مطالعه» یا کارت یک درس را لمس کن تا فرم مشخصات پارت باز شود.</li><li><b>افزودن مطالعه:</b> دکمه + پایین صفحه و گزینه «ثبت دستی» برای وارد کردن مطالعه‌ای است که قبلاً انجام داده‌ای.</li><li><b>جزئیات پارت:</b> روی هر پارت ثبت‌شده بزن تا مدت کل و مفید، موضوع، تست‌ها، کیفیت یادگیری و گزینه حذف را ببینی.</li></ul>
  <div class="guide-actions"><button class="btn btn-primary btn-sm" data-view="dashboard">رفتن به صفحه خانه</button></div>
 </div></details>
 <details class="guide-section"><summary><span class="guide-number">۲</span>شروع پارت با کرنومتر و توقف زمان</summary><div class="guide-content">
  <ol><li>از صفحه خانه، «شروع مطالعه» یا نام درس موردنظر را انتخاب کن.</li><li>درس، پایه دهم/یازدهم/دوازدهم یا پایه جامع، کتاب، فصل و موضوع را مشخص کن. برای حسابان جامع و ریاضی جامع، فصل‌های مربوط به همان درس در فهرست قرار دارند.</li><li>در بخش «نوع مطالعه درسی» می‌توانی چند گزینه را هم‌زمان انتخاب کنی: کلاس، درسنامه، مرور، تمرین، یادگیری، تست‌زنی و جمع‌بندی.</li><li>دکمه «شروع کرنومتر» را بزن. هنگام استراحت یا وقفه، «توقف» را لمس کن و برای ادامه، «ادامه» را بزن.</li><li>پس از پایان، «پایان و ثبت» را انتخاب کن تا فرم جزئیات پارت باز شود.</li></ol>
  <div class="guide-note">اگر صفحه بسته یا دوباره بارگذاری شود، زمان کرنومتر فعال بر اساس زمان شروع محاسبه می‌شود. برای آنکه پارت ناتمام باقی نماند، بعد از پایان کار حتماً گزینه «پایان و ثبت» را بزن.</div>
  <div class="guide-actions"><button class="btn btn-primary btn-sm" data-action="start-new">تنظیم پارت جدید</button></div>
 </div></details>
 <details class="guide-section"><summary><span class="guide-number">۳</span>سقف مطالعه روزانه ۱۳ ساعت و سقف هر پارت ۳ ساعت</summary><div class="guide-content">
  <p>دو محدودیت مستقل برای ثبت زمان وجود دارد و در تمام روزهای هفته اعمال می‌شوند:</p>
  <ul><li><b>سقف هر پارت: ۳ ساعت (۱۸۰ دقیقه).</b> کرنومتر در رسیدن به ۳ ساعت خودکار متوقف می‌شود و اخطار می‌دهد. ثبت دستی طولانی‌تر از ۳ ساعت پذیرفته نمی‌شود. برای ادامه مطالعه، پارت تازه‌ای شروع کن.</li><li><b>سقف هر روز مطالعاتی: ۱۳ ساعت.</b> اگر یک ثبت باعث عبور از سقف شود، سایت اخطار می‌دهد و فقط زمان باقی‌مانده تا ۱۳ ساعت را ثبت می‌کند؛ زمان مازاد ذخیره نمی‌شود.</li><li>وقتی ۱۳ ساعت همان روز تکمیل شد، ثبت زمان بیشتر برای آن روز امکان‌پذیر نیست. هدف روزانه نیز نمی‌تواند بیشتر از ۱۳ ساعت تنظیم شود.</li><li>زمان مفید نمی‌تواند از زمان کل پارت بیشتر باشد.</li></ul>
  <div class="guide-note warning">مثال: اگر امروز ۱۲ ساعت و ۳۰ دقیقه ثبت کرده باشی، از پارت بعدی حداکثر ۳۰ دقیقه پذیرفته می‌شود؛ حتی اگر کرنومتر یا ثبت دستی زمان بیشتری نشان دهد.</div>
 </div></details>
 <details class="guide-section"><summary><span class="guide-number">۴</span>ثبت جزئیات پس از هر مطالعه: زمان مفید، تست، تشریحی و کیفیت</summary><div class="guide-content">
  <ol><li><b>مدت کل مطالعه:</b> زمان کل پارت که از کرنومتر یا بازه دستی آمده است.</li><li><b>مدت مفید:</b> دقایقی که واقعاً مشغول مطالعه بوده‌ای وارد کن؛ این عدد باید حداکثر برابر مدت کل باشد.</li><li><b>حل تست؟</b> اگر «بله» را انتخاب کنی، تعداد کل تست، درست، غلط و بدون پاسخ را وارد کن. مجموع سه دسته باید برابر تعداد کل تست‌ها باشد.</li><li><b>درصد پاسخ‌گویی:</b> محاسبه با نمره منفی انجام می‌شود:</li></ol>
  <div class="guide-formula">((3 × درست) − غلط) ÷ (3 × تعداد کل) × 100</div>
  <p>سؤال بدون پاسخ در تعداد کل لحاظ می‌شود و نمره منفی ندارد. اگر تست کار نکرده‌ای «خیر» را انتخاب کن.</p>
  <ul><li><b>حل سؤال تشریحی؟</b> در صورت انتخاب «بله»، تعداد سؤال‌های تشریحی حل‌شده را بنویس.</li><li><b>کیفیت یادگیری:</b> اسلایدر «از صد درصد، چند درصد یادگرفتی؟ 👓» را از صفر تا صد تنظیم کن.</li><li>در پایان، «ثبت پارت» را لمس کن. پارت در صفحه خانه و گزارش‌ها محاسبه خواهد شد.</li></ul>
 </div></details>
 <details class="guide-section"><summary><span class="guide-number">۵</span>ثبت دستی و ثبت مطالعه برای روزهای گذشته</summary><div class="guide-content">
  <ol><li>از صفحه خانه دکمه «ثبت دستی» یا + را بزن.</li><li>درس، پایه، فصل، مبحث و نوع مطالعه را انتخاب کن.</li><li>تاریخ موردنظر و ساعت آغاز و پایان را وارد کن. اگر ساعت پایان از شروع زودتر باشد، پایان به روز بعد تعلق می‌گیرد.</li><li>پس از آن، اطلاعات زمان مفید، تست، سؤال تشریحی و کیفیت را در فرم ثبت کامل کن.</li></ol>
  <p>برای ثبت مطالعه در روزهای گذشته، به «باشگاه پیوستگی 📝» برو، روز موردنظر را در تقویم ۳۵ روز اخیر لمس کن و گزینه «ثبت مطالعه برای این روز» را بزن.</p>
  <div class="guide-note warning">پارت دستی که ساعت آن با یک پارت ثبت‌شده تداخل داشته باشد، ذخیره نمی‌شود و اخطار می‌گیری. بازه هر پارت همچنان حداکثر ۳ ساعت و مجموع هر روز حداکثر ۱۳ ساعت است.</div>
  <p>برای دیدن یا حذف یک پارت، روی همان ردیف پارت در صفحه خانه یا فهرست گزارش‌ها بزن و از جزئیات، گزینه حذف را انتخاب کن.</p>
 </div></details>
 <details class="guide-section"><summary><span class="guide-number">۶</span>هدف روزانه و برنامه‌ریزی هفتگی</summary><div class="guide-content">
  <p>در «تنظیمات ⚙️» دو بخش مرتبط با زمان‌بندی وجود دارد:</p>
  <ul><li><b>هدف ساعت مطالعه روزانه:</b> تعداد ساعت هدف را تنظیم کن. صفحه خانه نشان می‌دهد چند درصد از هدف را تکمیل کرده‌ای. سقف هدف ۱۳ ساعت است.</li><li><b>برنامه روزانه هفته:</b> برای شنبه تا جمعه، ساعت و دقیقه شروع و پایان روز مطالعاتی را با چهار اسلایدر جداگانه تنظیم کن. مقدار پیش‌فرض ۵ صبح تا ۵ صبح روز بعد است. این زمان‌ها به وقت تهران هستند و مرز محاسبه روز مطالعه را مشخص می‌کنند.</li><li>اگر زمان پایان مساوی یا زودتر از شروع باشد، پایان بازه در روز بعد در نظر گرفته می‌شود.</li></ul>
  <p><b>برنامه‌ریزی پارت‌های مطالعه:</b> در تنظیمات، «افزودن پارت به برنامه» را انتخاب کن؛ روز هفته و ساعت شروع و پایان را با اسلایدرهای ساعت و دقیقه تنظیم کن؛ سپس درس، پایه، فصل، مبحث، حل تست و تعداد تست موردنیاز و حل سؤال تشریحی را مشخص و ذخیره کن. می‌توانی چند پارت در هر روز بسازی یا پارت برنامه‌ریزی‌شده را حذف کنی.</p>
  <div class="guide-note">برنامه‌ریزی، یادآور زمان و موضوع موردنظر توست؛ به‌تنهایی زمان مطالعه ثبت نمی‌کند. پس از انجام واقعی مطالعه، کرنومتر یا ثبت دستی را استفاده کن.</div>
  <div class="guide-actions"><button class="btn btn-primary btn-sm" data-view="settings">باز کردن تنظیمات</button></div>
 </div></details>
 <details class="guide-section"><summary><span class="guide-number">۷</span>مدیریت درس‌ها و فهرست فصل‌ها</summary><div class="guide-content">
  <ul><li>درس‌ها بر اساس رشته انتخابی و پایه تحصیلی در فرم پارت نمایش داده می‌شوند.</li><li>برای افزودن درس اختصاصی، در صفحه خانه یا تنظیمات «افزودن درس» را بزن؛ نام، نماد و رنگ را تعیین کن.</li><li>برای حذف درس افزوده‌شده، در تنظیمات و بخش مدیریت دروس دکمه «حذف» را بزن و تأیید کن. درس‌های پیش‌فرض قابل حذف نیستند و سوابق پارت‌های قبلی باقی می‌مانند.</li><li>برای حسابان جامع در رشته ریاضی و ریاضی جامع در رشته تجربی، درس جداگانه را انتخاب کن تا فهرست فصل‌های جامع نمایش داده شود.</li><li>برای برخی کتاب‌های تخصصی هنرستان که فهرست رسمی کامل در برنامه وجود ندارد، عنوان فصل یا پودمان را باید دستی وارد کنی.</li></ul>
 </div></details>
 <details class="guide-section"><summary><span class="guide-number">۸</span>گزارش‌ها، نمودار سهم درس‌ها و خروجی PDF</summary><div class="guide-content">
  <p>از گزینه «گزارش‌ها 📊» در نوار پایین یا «آمار و گزارش» در نوار بالایی وارد صفحه گزارش شو.</p>
  <ul><li><b>نمودار دایره‌ای سهم درس‌ها:</b> با تب‌های روز، هفته و ماه، سهم زمانی هر درس را ببین. دکمه‌های قبل و بعد برای جابه‌جایی بین بازه‌های قبلی‌اند. کنار نمودار، مدت و درصد هر درس نمایش داده می‌شود.</li><li><b>گزارش هفتگی:</b> مجموع مطالعه کل و مفید، میانگین درصد پاسخ‌گویی، تعداد پارت، نمودار ساعات روزانه، تعداد تست و سؤال تشریحی، تفکیک درس‌ها و جزئیات هر روز را بررسی کن. با فلش‌ها هفته‌های قبلی را ببین.</li><li><b>جزئیات پارت:</b> در پایین گزارش، روی پارت موردنظر بزن تا اطلاعات کامل آن را ببینی.</li></ul>
  <h4 style="margin:13px 0 5px">دریافت گزارش هفتگی به صورت PDF</h4>
  <ol><li>در صفحه گزارش‌ها، هفته موردنظر را انتخاب کن.</li><li>به انتهای صفحه برو و «دریافت گزارش هفتگی PDF» را بزن.</li><li>پنجره چاپ دستگاه یا مرورگر باز می‌شود. در مقصد چاپ، «ذخیره به‌صورت PDF / Save as PDF» را انتخاب کن.</li><li>نام و محل ذخیره فایل را تعیین و ذخیره کن. در گوشی، ممکن است ابتدا منوی اشتراک‌گذاری یا چاپ سیستم باز شود.</li></ol>
  <div class="guide-note">گزارش PDF برای همان هفته انتخاب‌شده ساخته می‌شود. پیش از دریافت، هفته را با فلش‌های بالای گزارش کنترل کن.</div>
  <div class="guide-actions"><button class="btn btn-primary btn-sm" data-view="report">رفتن به گزارش‌ها</button></div>
 </div></details>
 <details class="guide-section"><summary><span class="guide-number">۹</span>بیدارباش و باشگاه پیوستگی</summary><div class="guide-content">
  <p><b>چالش سحرخیزی ☀️:</b> اگر شروع یک پارت مطالعه بین ساعت ۵:۰۰ تا پیش از ۹:۰۰ صبح به وقت تهران باشد، آن روز در چالش سحرخیزی ثبت می‌شود. تعداد روزهای سحرخیزی متوالی و وضعیت امروز در این بخش دیده می‌شود.</p>
  <p><b>باشگاه پیوستگی 📝:</b> تعداد روزهای متوالی مطالعه و تقویم ۳۵ روز اخیر را نشان می‌دهد. روزهای مطالعه‌شده و روزهایی که شروع مطالعه در بازه ۵ تا ۹ صبح بوده است، با نشانه‌های متفاوت نمایش داده می‌شوند. روی هر روز بزن تا پارت‌های آن را ببینی یا مطالعه گذشته را ثبت کنی.</p>
  <div class="guide-actions"><button class="btn btn-soft btn-sm" data-view="challenge">بیدارباش</button><button class="btn btn-primary btn-sm" data-view="streak">باشگاه پیوستگی</button></div>
 </div></details>
 <details class="guide-section"><summary><span class="guide-number">۱۰</span>گروه‌های مطالعاتی؛ ساخت، دعوت و به‌روزرسانی</summary><div class="guide-content">
  <ol><li>در باشگاه پیوستگی، «ساخت گروه» را بزن و نام گروه را وارد کن.</li><li>در کارت گروه، «دعوت عضو» را بزن. یک فایل JSON دعوت دریافت می‌کنی؛ آن را برای دوستت بفرست.</li><li>دوستت در همین بخش «پیوستن / دریافت گزارش» را انتخاب می‌کند و فایل دعوت را وارد می‌کند.</li><li>هر عضو برای ارسال آمار خود، در کارت گروه «ارسال گزارش من» را می‌زند و فایل گزارش JSON را برای مدیر یا مسئول به‌روزرسانی می‌فرستد.</li><li>مدیر گروه در «پیوستن / دریافت گزارش» فایل گزارش عضو را وارد می‌کند. پس از دریافت گزارش اعضا، «خروجی به‌روزرسانی گروه» را می‌زند و فایل جدید را برای اعضا می‌فرستد.</li><li>هر عضو فایل به‌روزرسانی گروه را از همان گزینه «پیوستن / دریافت گزارش» وارد می‌کند.</li></ol>
  <p>در کارت گروه، مجموع ساعت مطالعه اعضا در ۳۵ روز اخیر، میانگین مطالعه هر عضو، پیوستگی گروه، تعداد اعضای فعال امروز و جدول رتبه‌بندی اعضا نمایش داده می‌شود. رتبه گروهی بر اساس پیوستگی و سپس زمان مطالعه هفت روز اخیر مرتب می‌شود.</p>
  <div class="guide-note warning">گروه‌ها در این نسخه سرور مشترک و همگام‌سازی خودکار ندارند؛ اعضا باید فایل دعوت، گزارش و به‌روزرسانی گروه را دستی جابه‌جا کنند. فایل گزارش فقط نام نمایشی، پایه، رشته و زمان مطالعه روزانه را شامل می‌شود؛ تست‌ها، درصدها، نام درس‌ها، عکس پروفایل و گزارش خصوصی ارسال نمی‌شوند.</div>
 </div></details>
 <details class="guide-section"><summary><span class="guide-number">۱۱</span>رتبه‌بندی در پایه، رشته و گروه</summary><div class="guide-content">
  <p>از باشگاه پیوستگی، دکمه «مشاهده رتبه‌بندی» را بزن. در بالای آن، «رتبه‌های من» سه جایگاه را نشان می‌دهد:</p>
  <ul><li><b>رتبه در پایه:</b> مقایسه با پروفایل‌های واردشده از دانش‌آموزان همان پایه.</li><li><b>رتبه در رشته:</b> مقایسه با پروفایل‌های واردشده از همان رشته.</li><li><b>رتبه در گروه:</b> جایگاهت در هر گروه مطالعاتی که عضو آن هستی.</li></ul>
  <p>برای فعال‌شدن رتبه پایه و رشته، در بخش رتبه‌بندی «فعال‌سازی با رضایت من» را بزن و «خروجی پروفایل من» را برای دوستانت بفرست. دوستان باید فایل را در قسمت «وارد کردن فایل دوست» وارد کنند. پایه و رشته را در تنظیمات پروفایل به‌درستی ثبت کن.</p>
  <p>مرتب‌سازی بر اساس پیوستگی، سپس ساعت مطالعه هفت روز اخیر و برای رفع تساوی تعداد روزهای مطالعه است. برای رتبه گروهی نیز اعضا باید گزارش و فایل به‌روزرسانی گروه را مبادله کنند.</p>
  <div class="guide-note warning">رتبه‌ها در این نسخه زنده و سراسری نیستند و فقط از فایل‌هایی که روی همین دستگاه وارد شده‌اند محاسبه می‌شوند. فعال‌سازی پروفایل اختیاری است؛ پیش از اشتراک‌گذاری فایل، محتوای آن را در نظر بگیر.</div>
  <div class="guide-actions"><button class="btn btn-primary btn-sm" data-view="leaderboard">رفتن به رتبه‌بندی</button></div>
 </div></details>
 <details class="guide-section"><summary><span class="guide-number">۱۲</span>پروفایل، تم‌ها، پس‌زمینه و روزشمار رویداد</summary><div class="guide-content">
  <ul><li><b>نام و عکس پروفایل:</b> از تنظیمات، نام نمایشی را تغییر بده، عکس را از گالری انتخاب یا حذف کن. عکس و نام در این نسخه روی همان مرورگر ذخیره می‌شوند.</li><li><b>پایه تحصیلی:</b> پایه دهم، یازدهم یا دوازدهم را برای رتبه‌بندی انتخاب کن.</li><li><b>تم رنگی:</b> یکی از تم‌های تیره، روشن، بنفش، نارنجی یا AMOLED مشکی را انتخاب کن؛ هدر نیز با تم هماهنگ می‌شود.</li><li><b>پس‌زمینه:</b> می‌توانی تصویر جداگانه برای پس‌زمینه کلی برنامه، هدر و صفحه کرنومتر از حافظه گوشی انتخاب یا حذف کنی.</li><li><b>روزشمار رویداد:</b> عنوان و تاریخ آزمون یا رویداد را در تنظیمات وارد و ذخیره کن. عنوان و تعداد روزهای باقی‌مانده در صفحه خانه نمایش داده می‌شود؛ با رسیدن تاریخ، وضعیت «امروز» و سپس روزهای گذشته نشان داده خواهد شد.</li></ul>
  <div class="guide-actions"><button class="btn btn-primary btn-sm" data-view="settings">باز کردن تنظیمات</button></div>
 </div></details>
 <details class="guide-section"><summary><span class="guide-number">۱۳</span>پشتیبان‌گیری، بازیابی و محل نگهداری اطلاعات</summary><div class="guide-content">
  <ol><li>در تنظیمات و بخش «پشتیبان‌گیری از اطلاعات»، «خروجی JSON» را بزن تا نسخه پشتیبان سوابق و تنظیمات دانلود شود.</li><li>برای بازیابی، «بازیابی» را بزن و فایل پشتیبان JSON قبلی را انتخاب کن.</li><li>از فایل پشتیبان در محل امن نگهداری کن و قبل از جابه‌جایی مرورگر یا پاک‌کردن داده‌های مرورگر، یک نسخه جدید بگیر.</li></ol>
  <div class="guide-note warning">اطلاعات این نسخه عمدتاً در حافظه مرورگر همان دستگاه ذخیره می‌شوند. پاک‌کردن داده‌های مرورگر یا استفاده از مرورگر دیگر ممکن است به اطلاعات دسترسی ندهد؛ پشتیبان JSON را نگه دار. پروفایل، رتبه‌بندی و گروه‌ها در حال حاضر به حساب کاربری و سرور مرکزی متصل نیستند.</div>
 </div></details>
 <div class="guide-foot"><b>نیاز به شروع سریع داری؟</b> برای ثبت اولین پارت به صفحه خانه برو، درس را انتخاب کن، کرنومتر را شروع کن و در پایان اطلاعات پارت را کامل ثبت کن. بقیه قابلیت‌ها را می‌توانی هر زمان از نوار بالا یا پایین باز کنی.</div>
</div>`;}

<div class="personal-bg-tools"><div class="personal-bg-tool"><strong>پس‌زمینه هدر سایت</strong><small>تصویر انتخابی تمام کادر هدر را می‌پوشاند؛ اگر نسبت عکس با هدر متفاوت باشد، بخش‌های اضافی لبه‌ها به‌صورت خودکار برش می‌خورند. با انتخاب تصویر، چراغ مطالعه، گلدان و کتابخانه پنهان و با حذف تصویر دوباره نمایش داده می‌شوند.</small><div><label class="btn btn-soft btn-sm" for="header-wallpaper-file">انتخاب تصویر</label><input id="header-wallpaper-file" type="file" accept="image/*" class="hidden">${state.headerWallpaper?'<button class="btn btn-red btn-sm" data-action="remove-header-wallpaper">حذف تصویر</button>':''}</div></div><div class="personal-bg-tool"><strong>پس‌زمینه کرنومتر</strong><small>تصویر دلخواه فقط برای صفحه کرنومتر</small><div><label class="btn btn-soft btn-sm" for="timer-wallpaper-file">انتخاب تصویر</label><input id="timer-wallpaper-file" type="file" accept="image/*" class="hidden">${state.timerWallpaper?'<button class="btn btn-red btn-sm" data-action="remove-timer-wallpaper">حذف تصویر</button>':''}</div></div></div>

v>`:`<div class="empty-state" style="padding:15px"><strong>هنوز درسی اضافه نکرده‌ای</strong><div class="tiny">با گزینهٔ افزودن درس، فهرست را کامل کن.</div></div>`}</section><section class="panel"><h3 style="margin:0 0 8px">راهنمای محاسبه</h3><p class="small muted" style="margin:0">درصد پاسخ‌گویی تست‌ها طبق فرمول نمره منفی محاسبه می‌شود:</p><div dir="ltr" style="text-align:center;padding:14px;background:var(--panel2);border-radius:12px;margin-top:10px;font-weight:900;color:var(--green)">(3 × correct − wrong) ÷ (3 × total) × 100</div><p class="tiny muted">سوالات بدون پاسخ در تعداد کل سوالات لحاظ می‌شوند و امتیاز منفی نمی‌گیرند.</p></section>`;}
function openModal(html){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" data-action="backdrop-close"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;}
function closeModal(){document.getElementById('modal-root').innerHTML='';modalDraft=null;}
function renderFinishModal(totalMs,context){modalDraft={totalMs,context};return `<div class="modal-head"><div><h3>ثبت جزئیات پارت مطالعه</h3><div class="muted tiny">حداکثر هر پارت: ۳ ساعت · سقف روزانه: ۱۳ ساعت</div>${context.manualInterval?`<div class="muted tiny">${faDate(context.dayKey)} · ${timeTehran(context.startAt)} تا ${timeTehran(context.endAt)}</div>`:''}</div><button class="close-btn" data-action="close-modal">×</button></div><form id="finish-form"><div class="form-grid"><div class="field"><label>مدت زمان کل مطالعه (دقیقه)</label><input type="number" id="finish-total" min="1" max="180" value="${Math.max(1,Math.min(180,Math.round(totalMs/60000)))}" ${context.manualInterval?'readonly':''} required></div><div class="field"><label>مدت زمان مفید مطالعه (دقیقه)</label><input type="number" id="finish-useful" min="0" max="180" value="${Math.max(0,Math.min(180,Math.round(totalMs/60000)))}" required></div><div class="field full"><label>آیا تست کار کردی؟</label><div class="type-chips"><button class="type-chip selected" type="button" data-action="test-choice" data-value="no" id="test-no">خیر</button><button class="type-chip" type="button" data-action="test-choice" data-value="yes" id="test-yes">بله</button></div></div><div id="test-fields" class="full hidden"><div class="form-grid"><div class="field"><label>تعداد کل تست‌ها</label><input type="number" id="test-count" min="1" value="20"></div><div class="field"><label>پاسخ درست</label><input type="number" id="test-correct" min="0" value="0"></div><div class="field"><label>پاسخ اشتباه</label><input type="number" id="test-wrong" min="0" value="0"></div><div class="field"><label>بدون پاسخ</label><input type="number" id="test-blank" min="0" value="20"></div></div><div class="tiny muted" id="test-hint" style="margin-top:6px">جمع درست، اشتباه و بدون پاسخ باید برابر تعداد کل تست‌ها باشد.</div></div><div class="field full"><label>آیا سوال تشریحی حل کردی؟</label><div class="type-chips"><button class="type-chip selected" type="button" data-action="essay-choice" data-value="no" id="essay-no">خیر</button><button class="type-chip" type="button" data-action="essay-choice" data-value="yes" id="essay-yes">بله</button></div></div><div id="essay-fields" class="field full hidden"><label>تعداد سوالات تشریحی</label><input type="number" id="essay-count" min="0" value="0"></div><div class="field full"><label>از صد درصد، چند درصد یادگرفتی؟ 👓</label><div class="range-wrap"><input type="range" id="quality" min="0" max="100" value="75"><span class="range-value" id="quality-value">۷۵٪</span></div></div><div class="full field"><label>موضوع مطالعه</label><input id="finish-topic" maxlength="120" value="${esc(context.topic||'')}" placeholder="موضوع یا نکتهٔ این پارت"></div></div><div id="finish-error" class="tiny" style="color:#ff8290;margin-top:9px"></div><div class="modal-actions"><button class="btn btn-primary" type="submit">ثبت پارت ✓</button><button class="btn btn-soft" type="button" data-action="close-modal">انصراف</button></div></form>`;}
function beginSetup(subject=defaultStudySubject(),manual=false,dayKey=dateKey()){setupDraft=makeSetupDraft(subject,manual,dayKey);nav('setup');}

function saveSessionFromForm(){const totalMin=+document.getElementById('finish-total').value;const usefulMin=+document.getElementById('finish-useful').value;const quality=+document.getElementById('quality').value;const testsYes=document.getElementById('test-yes').classList.contains('selected');const essayYes=document.getElementById('essay-yes').classList.contains('selected');if(!Number.isFinite(totalMin)||totalMin<1||totalMin>180){showFinishError('⚠️ حداکثر زمان مجاز برای هر پارت ۱۸۰ دقیقه (۳ ساعت) است؛ زمان را اصلاح کن.');notify('⚠️ هر پارت مطالعه حداکثر ۳ ساعت می‌تواند باشد.','error');return;}if(!Number.isFinite(usefulMin)||usefulMin<0||usefulMin>totalMin){showFinishError('مدت زمان مفید باید بین صفر و مدت زمان کل باشد.');return;}let tests=null;if(testsYes){const count=+document.getElementById('test-count').value,correct=+document.getElementById('test-correct').value,wrong=+document.getElementById('test-wrong').value,blank=+document.getElementById('test-blank').value;if([count,correct,wrong,blank].some(x=>!Number.isInteger(x)||x<0)||count<1){showFinishError('تعداد تست‌ها باید عدد صحیح و تعداد کل بیشتر از صفر باشد.');return;}if(correct+wrong+blank!==count){showFinishError(`جمع پاسخ‌ها (${fa(correct+wrong+blank)}) باید با تعداد کل تست‌ها (${fa(count)}) برابر باشد.`);return;}const percent=((3*correct-wrong)/(3*count))*100;tests={count,correct,wrong,blank,percent};}let essayCount=0;if(essayYes){essayCount=+document.getElementById('essay-count').value;if(!Number.isInteger(essayCount)||essayCount<0){showFinishError('تعداد سوالات تشریحی نامعتبر است.');return;}}
const now=Date.now(),context=modalDraft.context;const startAt=context.startAt||now-totalMin*60000;const requestedEndAt=context.endAt||now;const requestedMs=context.manualInterval?requestedEndAt-startAt:totalMin*60000;if(requestedMs>MAX_PART_STUDY_MS){showFinishError('⚠️ مدت این پارت بیشتر از ۳ ساعت است و ثبت نمی‌شود.');notify('⚠️ حداکثر زمان هر پارت ۳ ساعت است.','error');return;}const dayKey=context.dayKey||dateKey(startAt);const remainingMs=remainingDailyStudyMs(dayKey);if(remainingMs<=0){const msg='سقف ۱۳ ساعت مطالعه برای این روز تکمیل شده است؛ زمان بیشتری ثبت نشد.';showFinishError(msg);notify(msg,'error');return;}const totalMs=Math.min(requestedMs,remainingMs);const wasCapped=totalMs<requestedMs;const endAt=context.manualInterval?Math.min(requestedEndAt,startAt+totalMs):requestedEndAt;if(context.manualInterval){const overlap=findTimeOverlap(startAt,endAt);if(overlap){showFinishError(overlapWarning(overlap));return;}}const usefulMs=Math.min(usefulMin*60000,totalMs);const session={id:crypto.randomUUID?crypto.randomUUID():String(now)+Math.random(),subject:context.subject,grade:context.grade,book:context.book||'',chapter:context.chapter||'',topic:document.getElementById('finish-topic').value.trim(),types:context.types||[],totalMs,usefulMs,tests,essayCount,quality,startAt,endAt,dayKey};state.sessions.push(session);if(!context.manualInterval)state.timer=null;saveState();closeModal();setupDraft=null;if(wasCapped){notify(`⚠️ سقف ۱۳ ساعت روزانه؛ فقط ${fmtDuration(totalMs)} از این پارت ثبت شد و زمان مازاد ثبت نشد.`,'error');}else{notify('پارت مطالعه با موفقیت ثبت شد 🌱');}nav(context.returnView||'dashboard');}
function showFinishError(msg){const e=document.getElementById('finish-error');if(e)e.textContent=msg;}
function detailModal(id){const s=state.sessions.find(x=>x.id===id);if(!s)return;const sub=getSubject(s.subject);const test=s.tests?`<div class="stat"><span class="label">تعداد تست</span><strong>${fa(s.tests.count)}</strong></div><div class="stat"><span class="label">درست / غلط / نزده</span><strong>${fa(s.tests.correct)} / ${fa(s.tests.wrong)} / ${fa(s.tests.blank)}</strong></div><div class="stat"><span class="label">درصد پاسخ‌گویی</span><strong>${fa(s.tests.percent.toFixed(1))}٪</strong></div>`:'<div class="muted small">تستی ثبت نشده است.</div>';openModal(`<div class="modal-head"><div><h3>${esc(s.subject)} · جزئیات پارت</h3><div class="muted tiny">${faDate(s.dayKey)} · ${timeTehran(s.startAt)} تا ${timeTehran(s.endAt)}</div></div><button class="close-btn" data-action="close-modal">×</button></div><div class="grid grid-2"><div class="stat"><span class="label">مدت کل</span><strong>${fmtDuration(s.totalMs)}</strong></div><div class="stat"><span class="label">مدت مفید</span><strong>${fmtDuration(s.usefulMs)}</strong></div><div class="stat"><span class="label">کیفیت یادگیری</span><strong>${fa(s.quality)}٪</strong></div><div class="stat"><span class="label">سوال تشریحی</span><strong>${fa(s.essayCount||0)}</strong></div></div><div class="panel" style="margin-top:12px;background:var(--panel2)"><div class="small"><b>پایه:</b> ${gradeLabel(s.grade)} · <b>کتاب:</b> ${esc(s.book||'بدون کتاب')}</div><div class="small" style="margin-top:5px"><b>فصل:</b> ${esc(s.chapter||'—')}</div><div class="small" style="margin-top:5px"><b>مبحث:</b> ${esc(s.topic||'—')}</div><div class="small" style="margin-top:5px"><b>نوع مطالعه:</b> ${esc((s.types||[]).join('، ')||'—')}</div></div><div class="section-head"><h3>عملکرد تستی</h3></div>${test}<div class="modal-actions"><button class="btn btn-red" data-action="delete-session" data-id="${s.id}">حذف این پارت</button><button class="btn btn-soft" data-action="close-modal">بستن</button></div>`);}
function confirmDelete(id){const s=state.sessions.find(x=>x.id===id);if(!s)return;openModal(`<div class="modal-head"><h3>حذف پارت مطالعه</h3><button class="close-btn" data-action="close-modal">×</button></div><p class="small muted">پارت «${esc(s.subject)}» برای همیشه از گزارش‌ها حذف شود؟</p><div class="modal-actions"><button class="btn btn-red" data-action="confirm-delete" data-id="${id}">بله، حذف کن</button><button class="btn btn-soft" data-action="close-modal">انصراف</button></div>`);}
function exportReport(){
 const {start,end,sessions}=weekSessions(state.reportWeekOffset);
 const st=weekStats(sessions);
 const days=Array.from({length:7},(_,i)=>addDays(start,i));
 const bars=days.map(k=>({k,v:sum(sessions.filter(s=>s.dayKey===k),s=>s.totalMs)}));
 const maxDay=Math.max(1,...bars.map(x=>x.v));

 sessions.forEach(s=>{const name=String(s.subject||'بدون عنوان');subjectMap[name]=(subjectMap[name]||0)+Math.max(0,Number(s.totalMs)||0);});
 const subjects=Object.entries(subjectMap).sort((a,b)=>b[1]-a[1]);

 const decorSrc=document.querySelector('.study-vignette-header')?.getAttribute('src')||'';
 const reportHeader=`<div class="pr-brand-strip">${decorSrc?`<img class="pr-print-decor" src="${decorSrc}" alt="چراغ مطالعه، گلدان و کتابخانه">`:''}<div class="pr-brand-logo"><span class="pr-brand-mark">◷</span><span class="pr-brand-name">مسیر مطالعه</span></div></div><div class="pr-head-main"><div class="pr-user"><div class="pr-avatar">${userPhoto}</div><div class="pr-user-meta"><strong>${esc(state.displayName||'دانش‌آموز')}</strong><small>دانش‌آموز ${gradeText}</small><small>${esc(trackLabel(ACTIVE_TRACK))}</small></div></div><div class="pr-title"><h1>گزارش کار و عملکرد مطالعاتی</h1><p>گزارش هفتگی · از ${weekStart} تا ${weekEnd}</p></div><div class="pr-period-side">گزارش شخصی<br>بر اساس زمان‌بندی تهران</div></div>`;
 const dailyRows=days.map(k=>{
   const ds=sessions.filter(s=>s.dayKey===k).sort((a,b)=>a.startAt-b.startAt);
   return `<tr><td>${dayName(k)}</td><td>${faDate(k)}</td><td>${ds.length?timeTehran(ds[0].startAt):'—'}</td><td>${ds.length?timeTehran(ds.at(-1).endAt):'—'}</td><td>${fmtDuration(sum(ds,s=>s.totalMs))}</td><td>${fmtDuration(sum(ds,s=>s.usefulMs))}</td><td>${fa(sum(ds,s=>s.tests?.count||0))}</td><td>${fa(sum(ds,s=>s.essayCount||0))}</td></tr>`;
 }).join('');
 const subjectRows=subjects.length?subjects.map(([name,value])=>`<div class="pr-subject-row"><span class="pr-subject-name">${esc(name)}</span><div class="pr-subject-track"><span style="width:${Math.max(1,value/maxSubject*100)}%"></span></div><span class="pr-subject-time">${fmtDuration(value)}</span></div>`).join(''):'<div class="pr-empty">در این هفته مطالعه‌ای ثبت نشده است.</div>';
 const lessonRows=sessions.slice().sort((a,b)=>a.startAt-b.startAt).map(s=>`<tr><td class="pr-align-right"><strong>${esc(s.subject||'—')}</strong><span class="pr-muted">${gradeLabel(s.grade)} · ${esc(s.book||'بدون کتاب')}</span></td><td class="pr-align-right">${esc(s.chapter||'—')}<span class="pr-muted">${esc(s.topic||'')}</span></td><td>${esc((s.types||[]).join('، ')||'—')}</td><td>${timeTehran(s.startAt)}</td><td>${timeTehran(s.endAt)}</td><td>${fmtDuration(s.totalMs)}</td><td>${fmtDuration(s.usefulMs)}</td><td>${fa(s.tests?.count||0)}</td><td>${fa(s.essayCount||0)}</td><td>${fa(s.quality)}٪<span class="pr-muted">${s.tests?fa(s.tests.percent.toFixed(1))+'٪ تست':'بدون تست'}</span></td></tr>`).join('');
 const root=document.getElementById('print-report');
 root.innerHTML=`<article class="pr-page pr-page-one">${reportHeader}
  <div class="pr-streak-banner"><span>پیوستگی مطالعه: <strong>${fa(streakCount())} روز</strong></span><span>گزارش هفتگی · ${fa(st.parts)} پارت ثبت‌شده</span></div>
  <div class="pr-stats"><div class="pr-stat"><small>مطالعه کل هفته</small><strong>${fmtDuration(st.total)}</strong><em>مجموع زمان پارت‌ها</em></div><div class="pr-stat"><small>میانگین مطالعه روزانه</small><strong>${fmtDuration(dailyAvg)}</strong><em>بر مبنای ۷ روز</em></div><div class="pr-stat"><small>مطالعه مفید</small><strong>${fmtDuration(st.useful)}</strong><em>زمان مفید ثبت‌شده</em></div><div class="pr-stat"><small>میانگین درصد پاسخ‌گویی</small><strong>${st.avg===null?'—':fa(st.avg.toFixed(1))+'٪'}</strong><em>${fa(st.parts)} پارت مطالعاتی</em></div></div>
  <section class="pr-section"><h2>ساعات مطالعه هفتگی</h2><div class="pr-chart">${bars.map(x=>`<div class="pr-bar-col"><span class="pr-bar-value">${x.v?fmtDuration(x.v):'۰۰:۰۰'}</span><div class="pr-bar-track"><div class="pr-bar" style="height:${Math.max(x.v?2:0,x.v/maxDay*100)}%"></div></div><small>${dayName(x.k)}</small></div>`).join('')}</div></section>
  <section class="pr-section"><h2>تفکیک مطالعه بر اساس درس</h2><div class="pr-subject-breakdown">${subjectRows}</div></section>
  <section class="pr-section"><h2>جزئیات روزانه هفته</h2><div class="pr-table-wrap"><table class="pr-table"><thead><tr><th>روز</th><th>تاریخ</th><th>شروع</th><th>پایان</th><th>مطالعه کل</th><th>مطالعه مفید</th><th>تستی</th><th>تشریحی</th></tr></thead><tbody>${dailyRows}</tbody><tfoot><tr><td colspan="4">مجموع هفته</td><td>${fmtDuration(st.total)}</td><td>${fmtDuration(st.useful)}</td><td>${fa(st.testsCount)}</td><td>${fa(st.essay)}</td></tr></tfoot></table></div></section>
  <div class="pr-footer">گزارش تولیدشده توسط مسیر مطالعه · زمان‌بندی بر اساس ساعت تهران</div></article>
  <article class="pr-page pr-page-two">${reportHeader}
